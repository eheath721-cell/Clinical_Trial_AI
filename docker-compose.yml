# Local full stack: PostgreSQL + FastAPI + Next.js.
#   cp .env.example .env   (then set DOCUMENT_ENCRYPTION_KEY)
#   docker compose up --build   ->  http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trialcompass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trialcompass}
      POSTGRES_DB: trialcompass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trialcompass"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://trialcompass:${POSTGRES_PASSWORD:-trialcompass}@db:5432/trialcompass
      DOCUMENT_STORAGE_DIR: /app/var/documents
    volumes:
      - documents:/app/var/documents
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  documents:
