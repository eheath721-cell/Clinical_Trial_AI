name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trialcompass
          POSTGRES_PASSWORD: trialcompass
          POSTGRES_DB: trialcompass_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trialcompass" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,llm]"
      - run: ruff check app tests scripts
      - name: Tests (SQLite)
        run: pytest
      - name: Tests (PostgreSQL)
        run: pytest
        env:
          DATABASE_URL: postgresql+psycopg://trialcompass:trialcompass@localhost:5432/trialcompass_test
      - name: Migrations match models
        run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: postgresql+psycopg://trialcompass:trialcompass@localhost:5432/trialcompass_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
